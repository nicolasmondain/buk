# Blogs, guides et archives sur le dessin old school (sélection du 2026-11-04).
#
# But : nourrir le sens artistique de buk (composition, construction des motifs, valeurs),
# pas ses réglages machine (ça, c'est research/sources.yaml).
#
# Règle : on analyse et on reformule des PRINCIPES ; on ne recopie jamais un flash.
# Les images téléchargées restent dans research/design/images/ (ignoré par git).
#
# type : guide (texte + schémas pédagogiques) · blog (articles) · archive (planches historiques)
# images : ce qu'on va y chercher pour l'analyse visuelle

sources:
